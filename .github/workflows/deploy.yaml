name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Plain deploy (not versions upload): traffic goes live immediately.
      # This repo is frozen on purpose — deploys are rare and reviewed.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action defaults to wrangler 3.90, which predates
          # _redirects/_headers support for Workers static assets: it uploads
          # them as plain files, so /t/* stops redirecting.
          wranglerVersion: '4'
